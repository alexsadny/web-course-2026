<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лендинг - Лабораторная 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">Название/Лого</div>
        
        <!-- Гамбургер-меню (только визуальная часть) -->
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <!-- Навигация -->
        <nav class="nav">
            <a href="#">Услуги</a>
            <a href="#">О нас</a>
            <a href="#">Контакты</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero">
            <h1>Главный заголовок лендинга</h1>
        </section>

        <!-- Сетка карточек -->
        <section class="services">
            <div class="card">Услуга 1</div>
            <div class="card">Услуга 2</div>
            <div class="card">Услуга 3</div>
        </section>

        <!-- Форма обратной связи -->
        <section class="contact">
            <form class="contact-form">
                <input type="text" placeholder="Имя" required>
                <input type="email" placeholder="Email" required>
                <textarea placeholder="Сообщение" required></textarea>
                <button type="submit">Отправить</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Александра</p>
    </footer>
</body>
</html>
