<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Быки и коровы - Лабораторная №4</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="game-app">
        <header>
            <h1>Быки и коровы</h1>
            <p class="subtitle">Угадайте 4-значное число с неповторяющимися цифрами</p>
        </header>

        <section class="controls">
            <input type="text" id="guess-input" placeholder="Например: 1234" maxlength="4">
            <button id="check-btn">Проверить</button>
            <button id="new-game-btn">Новая игра</button>
        </section>

        <!-- Блок для вывода ошибки валидации -->
        <p id="error-msg" class="error-msg hidden"></p>

        <section class="stats">
            <p>Попыток: <span id="attempts-count">0</span></p>
        </section>

        <ul id="history-list" class="history-list">
            <!-- История генерируется здесь через JS -->
        </ul>
    </main>
</body>
</html>
