<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List - Лабораторная №3</title>
    <link rel="stylesheet" href="style.css">
    <!-- Скрипт подключается с defer, как требует задание -->
    <script src="script.js" defer></script>
</head>
<body>
    <main class="todo-app">
        <header>
            <h1>Мои задачи</h1>
        </header>

        <section class="input-section">
            <input type="text" id="todo-input" placeholder="Что нужно сделать?">
            <button id="add-btn" aria-label="Добавить задачу">+</button>
        </section>

        <section class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </section>

        <ul id="todo-list" class="todo-list">
            <!-- Задачи будут генерироваться здесь через JS -->
        </ul>

        <footer class="stats">
            <p>Осталось: <span id="count-remaining">0</span></p>
            <p>Выполнено: <span id="count-completed">0</span></p>
        </footer>
    </main>
</body>
</html>
