<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
    <!-- Скрипт подключается с defer, чтобы он сработал после загрузки HTML -->
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app-container">
        <h1>Список задач</h1>
        
        <!-- Ввод новой задачи -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Что нужно сделать?">
            <button id="addBtn">Добавить</button>
        </div>
        <div id="warning" class="hidden">Поле не может быть пустым!</div>

        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </div>

        <!-- Статистика -->
        <div class="stats">
            Осталось: <span id="activeCount">0</span>, Выполнено: <span id="completedCount">0</span>
        </div>

        <!-- Сюда JS будет генерировать задачи -->
        <ul id="taskList"></ul>
    </div>
</body>
</html>
